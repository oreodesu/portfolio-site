# 単一EC2インスタンス上で全サービスをパスベースで振り分けるリバースプロキシ設定。
# サービス名はdocker-composeのservice名をそのままDNS名として利用する。

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # メインサイト (React): トップページ / TODO UI / 家計簿 UI
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # TODOアプリ API (Go)
    location /api/todo/ {
        proxy_pass http://todo-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 家計簿アプリ API (Rails)
    location /api/expense/ {
        proxy_pass http://expense-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # URL短縮サービスの画面 (Vue3、独立フロント)
    location /urlshortener/ {
        proxy_pass http://frontend-urlshortener:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # URL短縮 API (発行・一覧など)
    location /api/shorten/ {
        proxy_pass http://urlshortener-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # お問い合わせフォーム (Next.js)
    # Next.js側で basePath を /contact にしているため、パスは削らずそのまま渡す
    location /contact {
        proxy_pass http://contact-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 短縮URLのリダイレクト先 (例: /s/abc123)
    location /s/ {
        proxy_pass http://urlshortener-api:8000/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
