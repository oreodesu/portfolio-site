name: CI - frontend-urlshortener (Vue3)

on:
  push:
    branches: [main]
    paths:
      - "frontend-urlshortener/**"
      - ".github/workflows/ci-frontend-urlshortener.yml"
  pull_request:
    paths:
      - "frontend-urlshortener/**"
      - ".github/workflows/ci-frontend-urlshortener.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-urlshortener
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend-urlshortener/pnpm-lock.yaml

      - run: pnpm install
      - run: pnpm run build
