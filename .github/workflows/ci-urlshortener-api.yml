name: CI - urlshortener-api (PHP)

on:
  push:
    branches: [main]
    paths:
      - "services/urlshortener-api/**"
      - ".github/workflows/ci-urlshortener-api.yml"
  pull_request:
    paths:
      - "services/urlshortener-api/**"
      - ".github/workflows/ci-urlshortener-api.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/urlshortener-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql

      - run: composer install --no-interaction
      - run: find src public -name "*.php" -print0 | xargs -0 -n1 php -l
