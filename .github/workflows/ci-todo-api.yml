name: CI - todo-api (Go)

on:
  push:
    branches: [main]
    paths:
      - "services/todo-api/**"
      - ".github/workflows/ci-todo-api.yml"
  pull_request:
    paths:
      - "services/todo-api/**"
      - ".github/workflows/ci-todo-api.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/todo-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v
