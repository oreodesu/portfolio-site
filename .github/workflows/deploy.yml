name: Deploy (manual)

# 手動実行のみ。push契機のトリガーはあえて設定していない。
# 実行にはGitHub Secretsに登録する必要がある(未設定の間は失敗する)。:
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync repository to EC2 and restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            REPO_DIR="$HOME/portfolio-site"

            if [ ! -d "$REPO_DIR" ]; then
              git clone "${{ github.server_url }}/${{ github.repository }}.git" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            docker compose pull || true
            docker compose up -d --build
            docker image prune -f
