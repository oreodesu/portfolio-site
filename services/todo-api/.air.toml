root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/todo-api ./cmd/server"
  bin = "tmp/todo-api"
  full_bin = "TODO_DB_PATH=./todo.db TODO_API_PORT=8080 ./tmp/todo-api"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  delay = 1000

[log]
  time = true

[misc]
  clean_on_exit = true
