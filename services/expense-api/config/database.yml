default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  username: <%= ENV.fetch("DATABASE_USER", "expense_app") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  database: <%= ENV.fetch("DATABASE_NAME", "expense_db") %>

development:
  <<: *default

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "expense_db") %>_test

production:
  <<: *default
